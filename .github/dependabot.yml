# Keep immutable action pins current, grouped as in ctx's configuration. Monthly: this is a one-maintainer repo, and
# weekly update PRs were more noise than signal. Security updates are separate and still arrive immediately.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
